; Production PHP settings for imeihub.
; Loaded as /usr/local/etc/php/conf.d/zz-imeihub.ini
; (replace docker/php.ini in the production Dockerfile/compose).

; NEVER display errors to the browser in production.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /dev/stderr

; Performance: OPcache tuned for production.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 0

; Generous limits for the inline xlsx writer + occasional GSX reports.
memory_limit = 256M
post_max_size = 12M
upload_max_filesize = 12M

; Timezone
date.timezone = Asia/Bangkok

; Session cookie hardening.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.cookie_secure = 1
session.use_strict_mode = 1

; Security headers (supplement Apache's).
expose_php = Off
