; Dev-friendly PHP settings layered on top of the base image.
; Drop-in style: loaded as /usr/local/etc/php/conf.d/zz-imeihub.ini so
; it wins last over anything else in conf.d/.

; Surface errors directly to the browser + stderr while developing.
; Flip display_errors to Off (and APP_DEBUG=false in .env) for prod.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

; Generous limits for the inline xlsx writer + occasional GSX reports.
memory_limit = 256M
post_max_size = 12M
upload_max_filesize = 12M

; Bangkok-ish timezone for the seed dataset; can be overridden by env.
date.timezone = Asia/Bangkok

; Session cookie hardening matching includes/auth.php expectations.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
